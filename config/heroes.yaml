# Clash of Clans Hero Equipment & Ability Timing Configuration
# Handles modern Hero Equipment system (Active vs. Passive abilities)

heroes:
  archer_queen:
    enabled: true
    deployment_priority: 2
    has_active_ability: true
    equipment_preset: "Invisibility_Vial_Frozen_Arrow"
    ability_trigger_mode: "delay"
    ability_delay_seconds: 9 # Fast attack: triggers at T+9s to destroy core defenses with cloak
    notes: "Queen deployed behind Warden/Dragons. Cloak activated early for fast attack burst."

  minion_prince:
    enabled: true
    deployment_priority: 3
    has_active_ability: true
    equipment_preset: "Default"
    ability_trigger_mode: "delay"
    ability_delay_seconds: 7 # Fast attack: triggers at T+7s
    notes: "Minion Prince deployed along the attack flank with the army."

  grand_warden:
    enabled: true
    deployment_priority: 1 # Deployed first with troops
    has_active_ability: true
    equipment_preset: "Eternal_Tome_Life_Aura"
    ability_trigger_mode: "delay"
    ability_delay_seconds: 5 # Fast attack: triggers at T+5s as dragons enter defense range
    mode: "AIR" # Air mode to follow the Dragons
    notes: "Warden ability triggers early (T+5s) to shield the dragon fleet with Eternal Tome."

  barbarian_king:
    enabled: false # Not present in active TH11 army
    deployment_priority: 4
    has_active_ability: false

  royal_champion:
    enabled: false # Not present in active TH11 army
    deployment_priority: 5
    has_active_ability: false
